
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: todo-app:local
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: APP_ENV
            - name: APP_DEMO_SECRET
              valueFrom:
                secretKeyRef:
                  name: todo-app-secret
                  key: APP_DEMO_SECRET
          ports:
            - containerPort: 5000


